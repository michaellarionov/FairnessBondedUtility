[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fbu"
version = "0.2.0"
description = "Fairness Bonded Utility — fairness/performance trade-off metric (Wang et al., FAccT 2023)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "hypothesis>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/fbu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
